name: CI

# Runs the synthetic-fixture unit test suite only. Real LFW/CPLFW datasets
# and the pinned ONNX model binaries are never available to this workflow
# (they are never committed -- see .gitignore and docs/DATA_MANAGEMENT.md),
# so this job cannot and does not attempt to run the real experiment
# pipeline; it verifies the codebase's logic, not biometric accuracy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package (dev + review + report extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,review,report]'

      - name: Check pinned dependency contract
        run: python scripts/check_environment.py

      - name: Run test suite
        run: pytest -v

      - name: Confirm no real dataset or model file crept into the repo
        run: |
          if find . \( -iname "*.onnx" -o -iname "*.tgz" -o -iname "*.rar" \) \
               -not -path "./.git/*" | grep -q .; then
            echo "::error::Found a model/dataset archive file tracked in the repo"
            find . \( -iname "*.onnx" -o -iname "*.tgz" -o -iname "*.rar" \) -not -path "./.git/*"
            exit 1
          fi

      - name: Confirm committed results contain no personal/absolute path
        run: |
          python scripts/check_public_outputs.py \
            --paths results/aggregate results/report_evidence results/historical

      - name: Confirm the report evidence pack regenerates from committed results
        run: |
          python scripts/generate_report_evidence.py \
            --results-root results/aggregate \
            --output-root "${RUNNER_TEMP}/report_evidence_check"

      - name: Validate the committed evidence manifest
        run: |
          python - <<'PY'
          import json, hashlib, sys
          from pathlib import Path

          root = Path("results/report_evidence")
          manifest = json.loads((root / "report_evidence_manifest.json").read_text())
          index = (root / "REPORT_EVIDENCE_INDEX.md").read_text()

          problems = []
          for item in manifest["items"]:
              name = item["filename"]
              if name not in index:
                  problems.append(f"{name}: in manifest but not in the evidence index")
              if item["type"] == "manual_screenshot":
                  # Must stay declared-pending, never fabricated.
                  if item["sha256"] is not None or (root / name).exists():
                      problems.append(f"{name}: manual screenshot must not be fabricated")
                  continue
              path = root / name
              if not path.is_file():
                  problems.append(f"{name}: recorded in the manifest but missing on disk")
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != item["sha256"]:
                  problems.append(f"{name}: sha256 mismatch (committed artifact differs from its manifest entry)")
              for flag in ("contains_real_face_image", "contains_identity_information", "contains_absolute_path"):
                  if item[flag] is not False:
                      problems.append(f"{name}: {flag} must be false")

          if problems:
              print("::error::evidence manifest validation failed")
              for problem in problems:
                  print(f"  {problem}")
              sys.exit(1)
          print(f"OK   {len(manifest['items'])} manifest entries validated against disk and the index")
          PY
